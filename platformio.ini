; ideaspark ESP32 16MB + 1.9 吋 ST7789 TFT LCD（170x320）
; 接腳來源為社群資料，尚待實機驗證，見 CLAUDE.md
[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI 設定直接寫在 build_flags，不修改函式庫內的 User_Setup.h
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    ; 背光（GPIO32）不交給 TFT_eSPI，由 main.cpp 自行控制，見 CLAUDE.md 已知注意事項
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
