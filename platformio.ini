; ideaspark ESP32 16MB + 1.9 吋 ST7789 TFT LCD（170x320）
; 接腳來源為社群資料，尚待實機驗證，見 CLAUDE.md
[platformio]
; 預設只編譯主程式；實機第一次測試請用 hwtest 環境（pio run -e hwtest -t upload）
default_envs = esp32dev

; TFT_eSPI 設定直接寫在 build_flags，不修改函式庫內的 User_Setup.h
; 接腳、字型、SPI 速度各環境共用；驅動晶片與解析度由各環境自己指定
[tft_common]
build_flags =
    -DUSER_SETUP_LOADED=1
    -DTFT_MISO=-1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    ; 背光（GPIO32）不交給 TFT_eSPI，由程式自行控制，見 CLAUDE.md 已知注意事項
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ricmoo/QRCode@^0.0.1

; 讀取 OTA 密碼（環境變數或 ota_password.txt），見 scripts/ota_password.py
extra_scripts = pre:scripts/ota_password.py

build_flags =
    ${tft_common.build_flags}
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320

; 無線更新（OTA）：先用 USB 燒錄一次含 OTA 的韌體，之後用 Wi-Fi 更新（pio run -e ota -t upload）
; 主機名稱與 src/config.h 的 WIFI_HOSTNAME 相同；找不到時可改用 --upload-port 指定 IP
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = esp32-lcd.local

; 硬體測試：只跑填色與文字，用來單獨核對接腳、顏色與偏移，不含 Wi-Fi
[env:hwtest]
extends = env:esp32dev
build_src_filter =
    -<*>
    +<../hwtest/>

; Wokwi 模擬：Wokwi 沒有 ST7789，改用它的 ILI9341（240x320）；直接連 Wokwi-GUEST，跳過配網與 OTA
; 只能驗證版面與已連線後的流程，驗證不了 ST7789V3 初始化、顏色、偏移與背光；見 README「Wokwi 模擬」
[env:wokwi]
extends = env:esp32dev
build_flags =
    ${tft_common.build_flags}
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DWOKWI_SIM=1
